<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catch the Cat</title>
    <style>
        body {
            margin: 0;
            background-color: #9966FF; 
            font-family: sans-serif;
            overflow: hidden;
        }

        #game-area {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        /* Top HUD / UI */
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
        }

        .hud-box {
            background: white;
            padding: 5px 15px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 16px;
            border: 2px solid #FFA500;
        }

        /* The Cat Sprite */
        #cat {
            position: absolute;
            width: 100px;
            cursor: pointer;
            display: none;
        }

        /* Start Screen / Menu Overlay */
        #menu-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #9966FF;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .menu-btn {
            padding: 15px 40px;
            font-size: 24px;
            cursor: pointer;
            border-radius: 30px;
            border: none;
            background: white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            font-weight: bold;
            margin: 10px;
        }
    </style>
</head>
<body>

    <div id="game-area">
        <!-- Start Menus matching your video -->
        <div id="menu-screen">
            <button class="menu-btn" id="main-start-btn" onclick="showDeviceMenu()">Start</button>
            <div id="device-menu" style="display: none;">
                <button class="menu-btn" onclick="startGame('mobile')">Mobile</button>
                <button class="menu-btn" onclick="startGame('tab')">Tab</button>
                <button class="menu-btn" onclick="startGame('pc')">PC</button>
            </div>
        </div>

        <!-- In-game HUD -->
        <div id="ui">
            <div class="hud-box">Cat: Score: <span id="scoreDisplay">0</span></div>
            <div class="hud-box">highscore: <span id="highscoreDisplay">0</span></div>
            <div class="hud-box">timer: <span id="timerDisplay">0</span></div>
        </div>
        
        <!-- Updated to point to cat.svg as shown in your files -->
        <img id="cat" src="cat.svg" alt="Cat Sprite" onclick="catClicked()">
    </div>

    <script>
        let score = 0;
        let highscore = localStorage.getItem("highscore") || 7; // Default from your video
        let gameState = "Off";
        let timer = 0;
        let timerInterval = null;

        const cat = document.getElementById("cat");
        const scoreDisplay = document.getElementById("scoreDisplay");
        const highscoreDisplay = document.getElementById("highscoreDisplay");
        const timerDisplay = document.getElementById("timerDisplay");
        const menuScreen = document.getElementById("menu-screen");
        const mainStartBtn = document.getElementById("main-start-btn");
        const deviceMenu = document.getElementById("device-menu");

        highscoreDisplay.innerText = highscore;

        // Step 1: Click initial start button, show device selection
        function showDeviceMenu() {
            mainStartBtn.style.display = "none";
            deviceMenu.style.display = "block";
        }

        // Step 2: Choose device, set size, launch game & music
        function startGame(deviceType) {
            menuScreen.style.display = "none";

            // Set size based on device button chosen
            if (deviceType === 'mobile') {
                cat.style.width = "100px";
            } else if (deviceType === 'tab') {
                cat.style.width = "80px";
            } else {
                cat.style.width = "60px"; // PC size
            }

            // Play background music safely on loop
            let bgm = new Audio('https://commondatastorage.googleapis.com/codeskulptor-demos/DDR_assets/Kangaroo_MusiQue_-_The_Neverwritten_Role_Playing_Game.mp3');
            bgm.loop = true;
            bgm.play().catch(err => console.log("Audio play blocked/failed:", err));

            // Reset game variables
            score = 0;
            scoreDisplay.innerText = score;
            timer = 0;
            
            // Start Timer counting up
            timerInterval = setInterval(() => {
                timer++;
                timerDisplay.innerText = timer;
            }, 1000);

            gameState = "On";
            cat.style.display = "block";
            
            catMovementLoop(1500);
        }

        // Click on the Cat
        function catClicked() {
            if (gameState === "On") {
                score += 1;
                scoreDisplay.innerText = score;

                if (score > highscore) {
                    highscore = score;
                    highscoreDisplay.innerText = highscore;
                    localStorage.setItem("highscore", highscore);
                }

                cat.style.display = "none";
            }
        }

        // Movement Loop
        function catMovementLoop(waitTime) {
            if (gameState !== "On") return;

            cat.style.display = "none";

            setTimeout(() => {
                if (gameState !== "On") return;

                const randomX = Math.floor(Math.random() * 80);
                const randomY = Math.floor(Math.random() * 80);
                
                cat.style.left = randomX + "vw";
                cat.style.top = randomY + "vh";
                cat.style.display = "block";

                let nextWaitTime = waitTime - 100;
                if (nextWaitTime < 500) nextWaitTime = 500;

                setTimeout(() => {
                    catMovementLoop(nextWaitTime);
                }, waitTime);

            }, 1000);
        }
    </script>
</body>
</html>
